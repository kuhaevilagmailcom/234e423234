name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck and build
        run: npm run build

      - name: Hosting startup smoke test
        run: |
          rm -rf dist
          PORT=8787 node start.mjs > /tmp/zayava.log 2>&1 &
          APP_PID=$!
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/ > /tmp/zayava-index.html; then
              kill $APP_PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zayava.log
          kill $APP_PID || true
          exit 1
